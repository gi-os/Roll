name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'signing-fingerprint.txt'
  workflow_dispatch:
    inputs:
      channel:
        description: 'nightly (default) or official'
        type: choice
        options: [nightly, official]
        default: nightly

permissions:
  contents: write
  # light-common is pulled from GitHub Packages, which has no anonymous read.
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # versionCode is the workflow run number, so every push produces a newer build and
      # `adb install -r` upgrades in place instead of erroring. versionName keeps the
      # major.minor from the build file and takes the run number as its patch, so the tag
      # moves on every push and Obtainium always has something newer to offer.
      - name: Stamp version
        id: ver
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
        run: |
          RUN=${{ github.run_number }}

          # A push is a nightly. Roll ships more often than anything else here, and
          # every one of those pushes used to be offered to everyone within the hour
          # -- fine when one person ran it, wrong once people rely on it. An official
          # build is asked for: `[release]` in the commit subject, or running this
          # workflow by hand and picking official.
          CHANNEL=nightly
          # The SUBJECT LINE only. Searching the whole message means any commit that
          # merely discusses releasing cuts a release.
          SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -1)
          case "$SUBJECT" in *"[release]"*) CHANNEL=official ;; esac
          # Empty on a push, so a dispatch cannot inherit a [release] from the commit
          # it happens to be sitting on.
          if [ "$DISPATCH_CHANNEL" = "official" ]; then CHANNEL=official; fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "building a ${CHANNEL}"

          BASE=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')
          VERSION="${BASE}.${RUN}"
          sed -i -E "s/versionCode = .*/versionCode = ${RUN}/" app/build.gradle.kts
          sed -i -E "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Unit tests
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # The signing key is a secret, not a file in the repository. It is written here and
      # nowhere else, and the path is git-ignored so a local checkout cannot commit it back.
      - name: Restore signing keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > keystore/lightcamera.jks
          # A missing or truncated secret would otherwise fall through to an unsigned release
          # that the fingerprint step rejects with a confusing message. Fail where the cause is.
          test -s keystore/lightcamera.jks || { echo '::error::KEYSTORE_B64 is empty'; exit 1; }

      - name: Build APKs
        env:
          # Scoped to issues:write on the private gi-os/light-reports repo and nothing else,
          # because it ends up inside a sideloaded APK anyone can unzip. A missing secret is
          # not a build failure: reports queue on the phone until a keyed build arrives.
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p out debugout
          cp app/build/outputs/apk/release/app-release.apk "out/LightCamera-v$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "debugout/LightCamera-v$V-debug.apk"
          ls -la out debugout

      # Android identifies an app by (packageName, signing cert). If the cert ever changes,
      # Obtainium updates fail with an opaque "Failure: Invalid", so pin it.
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs out/*.apk \
            | grep -i 'SHA-256 digest' | head -1 | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ' ')
          EXPECTED=$(tr -d ' :\n' < signing-fingerprint.txt | tr 'A-F' 'a-f')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo '::error::signing certificate drifted'; exit 1; }

      # AGP shortens resource paths in release builds, so ic_launcher.png is renamed to
      # something like res/AB.png inside the zip. Ask the package what its icon is instead
      # of grepping filenames — the same lookup Obtainium and the launcher do.
      - name: Verify launcher icon is present
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging out/*.apk > badging.txt
          grep -E "^(application:|application-icon-)" badging.txt
          grep -qE "^application:.*icon='[^']+'" badging.txt \
            || { echo '::error::package declares no launcher icon'; exit 1; }

      # This app is only worth installing if the phone will hand it the camera key, so the
      # intent filters that make it a default camera are part of the build contract.
      - name: Verify camera intent filters
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump xmltree --file AndroidManifest.xml out/*.apk > manifest.txt
          for action in \
            android.media.action.STILL_IMAGE_CAMERA \
            android.media.action.IMAGE_CAPTURE \
            android.intent.action.CAMERA_BUTTON; do
            grep -q "$action" manifest.txt \
              || { echo "::error::$action filter missing"; exit 1; }
          done
          echo "camera intent filters present"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LightCamera-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LightCamera-debug-apk
          path: debugout/*.apk
          if-no-files-found: error

      # The whole file was the release body, so every release carried the entire
      # history and BrightMarket showed all of it as "what changed". Newest section
      # only, with a fallback so a release never blocks on prose.
      - name: Extract release notes
        id: notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            awk '/^## /{n++} n==1' RELEASE_NOTES.md | tail -n +2 > body.md
          fi
          [ -s body.md ] || echo "See the commit log for changes in this build." > body.md
          echo "--- release body ---"; cat body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Nightlies get their own tag namespace so they never read as a version,
          # and `prerelease: true` is the entire guarantee that they reach nobody who
          # has not opted in -- the index builder skips prereleases when choosing the
          # stable entry and records them separately under `preview`.
          tag_name: >-
            ${{ steps.ver.outputs.channel == 'official'
                && format('v{0}', steps.ver.outputs.version)
                || format('nightly-{0}', steps.ver.outputs.version) }}
          name: >-
            ${{ steps.ver.outputs.channel == 'official'
                && format('Roll v{0}', steps.ver.outputs.version)
                || format('Nightly {0}', steps.ver.outputs.version) }}
          files: out/LightCamera-v${{ steps.ver.outputs.version }}.apk
          body_path: body.md
          prerelease: ${{ steps.ver.outputs.channel != 'official' }}
          make_latest: ${{ steps.ver.outputs.channel == 'official' }}

      # Tell the index a release exists instead of waiting for its cron. GitHub
      # schedules are best-effort -- observed 70 minutes apart against a 15
      # minute schedule -- so without this a new release can sit uncatalogued
      # for over an hour and simply not appear as an update.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          # A retry-and-shrug step must print which failure it shrugged at. The old
          # form printed one fixed sentence, so a dead token, a network blip and a
          # renamed repo were indistinguishable -- and a 401 went unnoticed across
          # the whole fleet for weeks.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}") || code=000
          if [ "$code" = "204" ]; then
            echo "index pinged"
          else
            echo "::warning::index ping refused with HTTP $code; the cron will pick this up"
          fi
